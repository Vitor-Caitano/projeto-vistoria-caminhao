<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gerenciamento de Vistorias</title>

    <link rel="stylesheet" href="./style/style.css">
</head>

<body>

    <header>
        <span class="brand-name"><a href="vistoria.html">Vistoria de Caminhões</a></span>
        <div style="display: flex; gap: 40px;">
            <div id="menuHeader">
                <a href="vistoria.html">Vistorias</a>
                <a id="menuOperador" href="ocorrencias.html">Ocorrências</a>
            </div>
            <button id="deslogar">Sair da conta</button>
        </div>
    </header>

    <main>

        <div class="container">

            <h1>VISTORIAS</h1>

            <a href="vistoriaAgendamento.html">Criar nova vistoria</a>

            <div id="filtros">

                <label for="ordem">Ordenar por: </label>
                <select name="ordem" id="ordem">
                    <option value="1">Mais recente</option>
                    <option value="2">Mais antigo</option>
                </select>

            </div>

            <section class="card">

                <div id="botoesFiltro">

                    <button id="fTodos" class="ativado">Todos</button>
                    <button id="concluida" class="desativado">Concluídas</button>
                    <button id="inconcluida" class="desativado">Inconcluídas</button>

                </div>

                <table>

                    <tbody id="tbodyVistorias">

                    </tbody>

                </table>

                <div id="pagination">

                </div>

            </section>


            <!-- Popup para editar item da vistoria -->
            <div id="popupEditar" class="popup">
                <div class="popup-conteudo">
                    <h2>Registrar item da vistoria</h2>
                    <form id="formEditarItem">
                        <input type="hidden" id="codVistoria">
                        <label for="nomeItem">Nome do item:</label>
                        <input type="text" id="nomeItem" placeholder="Ex.: Faróis e lanternas" required>
                        <label for="descricaoItem">Descrição:</label>
                        <textarea id="descricaoItem" placeholder="Descreva a situação encontrada..."required></textarea>

                        <label for="dataEdicao">Data da edição:</label>
                        <input type="date" id="dataEdicao" required>

                        <label for="gravidade">Gravidade:</label>
                        <select id="gravidade" required>
                            <option value="">Selecione a gravidade</option>
                            <option value="OK">OK</option>
                            <option value="Leve">Leve</option>
                            <option value="Moderada">Moderada</option>
                            <option value="Grave">Grave</option>
                        </select>

                        <div class="botoesPopup">
                            <button type="button" id="cancelarPopup">
                                Cancelar
                            </button>

                            <button type="submit" id="salvarItem">
                                Salvar item
                            </button>
                        </div>
                    </form>
                </div>
            </div>
        </div>

        <footer aria-hidden="true">
            <p>Site desenvolvido para Disciplina de Desenvolvimento Web Back End</p>
        </footer>

    </main>


    <script type="module" src="./front/appVistoria.js"></script>

</body>

</html>
