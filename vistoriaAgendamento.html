<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Agendar Vistoria</title>
    <link rel="stylesheet" href="./style/style.css">
</head>
<body>

    <header>
        <img src="https://picsum.photos/45/45" alt="">
    </header>

    <div class="container">
        <h1>Vistoria de Caminhões</h1>
        <div id="mensagem"></div>
        <form id="formVistoria">
            <section class="card">
                <h2>Agendar Vistoria</h2>
                <input type="hidden" id="id">
                <label for="placaCaminhao">Caminhão</label>
                <select id="placaCaminhao" required>
                    <option value="">Selecione o caminhão</option>
                </select>
                <label for="operador">Operador responsável</label>
                <select id="operador" required>
                    <option value="">Operador o analista</option>
                </select>
                <label for="dataPrevista">Data prevista</label>
                <input type="date" id="dataPrevista" required>
                <label for="horarioPrevisto">Horário previsto</label>
                <input type="time" id="horarioPrevisto" required>
            </section>

            <section class="card">
                <h2>Itens para Vistoria</h2>
                <p>Selecione os componentes que deverão ser inspecionados.</p>
                <div class="checklist">
                    <label>
                        <input type="checkbox" name="itensVistoria" value="Pneus e rodas"> Pneus e rodas
                    </label>

                    <label>
                        <input type="checkbox" name="itensVistoria" value="Sistema de freios"> Sistema de freios
                    </label>

                    <label>
                        <input type="checkbox" name="itensVistoria" value="Faróis e lanternas"> Faróis e lanternas
                    </label>

                    <label>
                        <input type="checkbox" name="itensVistoria" value="Retrovisores e para-brisa"> Retrovisores e para-brisa
                    </label>

                    <label>
                        <input type="checkbox" name="itensVistoria" value="Sistema de direção"> Sistema de direção
                    </label>

                    <label>
                        <input type="checkbox" name="itensVistoria" value="Suspensão">Suspensão
                    </label>

                    <label>
                        <input type="checkbox" name="itensVistoria" value="Motor"> Motor
                    </label>

                    <label>
                        <input type="checkbox" name="itensVistoria" value="Vazamentos"> Vazamentos
                    </label>

                    <label>
                        <input type="checkbox" name="itensVistoria" value="Documentação"> Documentação
                    </label>

                    <label>
                        <input type="checkbox" name="itensVistoria" value="Chassi e estrutura"> Chassi e estrutura
                    </label>
                </div>
            </section>

            <section class="card">
                <h2>Observações</h2>
                <textarea id="observacao" placeholder="Informações adicionais sobre a vistoria..." rows="4">
                </textarea>
            </section>

            <div class="acoes">
                <button type="submit" id="btnSalvar">
                    Agendar Vistoria
                </button>

                <button type="reset" id="btnNovo">
                    Novo
                </button>
            </div>
        </form>
    </div>
    <script type="module" src="./front/app.js"></script>
</body>
</html>
