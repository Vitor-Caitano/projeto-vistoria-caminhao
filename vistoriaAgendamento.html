<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Agendar Vistoria</title>
    <link rel="stylesheet" href="./style/style.css">
</head>

<body>

    <header>
        <span class="brand-name"><a href="vistoria.html">Vistoria de Caminhões</a></span>
        <div style="display: flex; gap: 40px;">
            <div id="menuHeader">
                <a href="vistoria.html">Vistorias</a>
                <a id="menuOperador" href="ocorrencias.html">Ocorrências</a>
            </div>
            <button id="deslogar">Sair da conta</button>
        </div>
    </header>

    <div class="container">
        <h1>Vistoria de Caminhões</h1>
        <div id="mensagem"></div>
        <form id="formVistoria">
            <section class="card">
                <h2>Agendar Vistoria</h2>
                <input type="hidden" id="id">
                <label for="placaCaminhao">Caminhão</label>
                <select id="placaCaminhao" required>
                    <option value="">Selecione o caminhão</option>
                </select>
                <label for="operador">Operador responsável</label>
                <select id="operador" required>
                    <option value="">Operador o analista</option>
                </select>
                <label for="dataPrevista">Data prevista</label>
                <input type="date" id="dataPrevista" required>
                <label for="horarioPrevisto">Horário previsto</label>
                <input type="time" id="horarioPrevisto" required>
            </section>

            <section class="card">
                <h2>Itens para Vistoria</h2>
                <p>Selecione os componentes que deverão ser inspecionados.</p>
                <div class="checklist">
                    <label>
                        <input type="checkbox" name="itensVistoria" value="Pneus e rodas"> Pneus e rodas
                    </label>

                    <label>
                        <input type="checkbox" name="itensVistoria" value="Sistema de freios"> Sistema de freios
                    </label>

                    <label>
                        <input type="checkbox" name="itensVistoria" value="Faróis e lanternas"> Faróis e lanternas
                    </label>

                    <label>
                        <input type="checkbox" name="itensVistoria" value="Retrovisores e para-brisa"> Retrovisores e
                        para-brisa
                    </label>

                    <label>
                        <input type="checkbox" name="itensVistoria" value="Sistema de direção"> Sistema de direção
                    </label>

                    <label>
                        <input type="checkbox" name="itensVistoria" value="Suspensão">Suspensão
                    </label>

                    <label>
                        <input type="checkbox" name="itensVistoria" value="Motor"> Motor
                    </label>

                    <label>
                        <input type="checkbox" name="itensVistoria" value="Vazamentos"> Vazamentos
                    </label>

                    <label>
                        <input type="checkbox" name="itensVistoria" value="Documentação"> Documentação
                    </label>

                    <label>
                        <input type="checkbox" name="itensVistoria" value="Chassi e estrutura"> Chassi e estrutura
                    </label>
                </div>
            </section>

            <section class="card">
                <h2>Observações</h2>
                <textarea id="observacao" placeholder="Informações adicionais sobre a vistoria..." rows="4">
                </textarea>
            </section>

            <div class="acoes">
                <button type="submit" id="btnSalvar">
                    Agendar Vistoria
                </button>

                <button type="reset" id="btnNovo">
                    Cadastrar Caminhão
                </button>
            </div>
        </form>
        <!-- Popup de cadastro de caminhão -->
        <div id="popupCaminhao" class="modal">

            <div class="modal-conteudo">

                <h2>Cadastrar Novo Caminhão</h2>

                <form id="formCaminhao">

                    <label for="placa">Placa</label>
                    <input type="text" id="placa" maxlength="7" placeholder="Ex: ABC1D23" required>

                    <label for="modelo">Modelo</label>
                    <input type="text" id="modelo" placeholder="Modelo do caminhão" required>

                    <label for="marca">Marca</label>
                    <input type="text" id="marca" placeholder="Marca do caminhão" required>

                    <label for="ano">Ano</label>
                    <input type="number" id="ano" required>

                    <label for="capacidade">Capacidade</label>
                    <input type="number" id="capacidade" step="0.01" min="0" required>

                    <label for="peso">Peso</label>
                    <input type="number" id="peso" step="0.01" min="0" required>

                    <label for="numEixos">Número de eixos</label>
                    <input type="number" id="numEixos" min="1" step="1" required>

                    <div class="acoes">
                        <button type="submit" id="btnCadastrar">
                            Cadastrar
                        </button>

                        <button type="button" id="btnFechar">
                            Cancelar
                        </button>
                    </div>

                </form>

            </div>

        </div>
    </div>

    <footer aria-hidden="true">
        <p>Site desenvolvido para Disciplina de Desenvolvimento Web Back End</p>
    </footer>

    <script type="module" src="./front/appUsuario.js"></script>
    
</body>
</html>
