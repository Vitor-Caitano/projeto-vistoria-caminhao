<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <title>Gerenciamento de Usuários</title>

    <link rel="stylesheet" href="./style/style.css">
</head>

<body>

    <header>
        <img src="https://picsum.photos/45/45" alt="">
    </header>

    <div class="container">

        <h1>Vistoria de Caminhões</h1>

        <div id="mensagem"></div>

        <section class="card">

            <h2>Cadastro de Usuário</h2>

            <input type="hidden" id="id">

            <input type="text" placeholder="Nome" id="nome">

            <input type="text" placeholder="Email" id="email">

            <select name="tipo" id="tipoUsuario">
                <option value="analista">Analista</option>
                <option value="operador">Operador</option>
            </select>

            <br>

            <input type="number" placeholder="Nº de Vistorias" id="nVistorias">

            <input type="number" placeholder="Nº de Ocorrências" id="nOcorrencias">

            <div class="acoes">

                <button id="btnSalvar">
                    Salvar
                </button>

                <button id="btnNovo">
                    Novo
                </button>

            </div>

        </section>

        <section id="filtros">

            <button id="fTodos" class="ativado">Todos</button>
            <button id="analistas" class="desativado">Analistas</button>
            <button id="operadores" class="desativado">Operadores</button>

        </section>

        <section class="card">

            <h2>Caminhões Cadastrados</h2>

            <table>

                <thead>
                    <tr>
                        <th>ID</th>
                        <th>Nome</th>
                        <th>Email</th>
                        <th>Tipo</th>
                        <th>Data de Adesão</th>
                        <th>Nº Vistorias</th>
                        <th>Nº Ocorrências</th>
                    </tr>
                </thead>

                <tbody id="tbodyUsuarios">

                </tbody>

            </table>

            <div id="pagination">

            </div>

        </section>

    </div>

    <script type="module" src="./front/appUsuario.js"></script>

</body>
</html>
