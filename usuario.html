<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <title>Gerenciamento de Usuários</title>

    <link rel="stylesheet" href="./style/style.css">
</head>

<body>

<div class="container">

    <h1>Vistoria de Caminhões</h1>

    <div id="mensagem"></div>

    <section class="card">

        <h2>Cadastro de Usuário</h2>

        <input type="hidden" id="id">

        <label>Nome</label>
        <input type="text" id="nome">

        <label>Email</label>
        <input type="text" id="especie">

        <label>XXXX</label>
        <input type="text" id="x1">

        <label>XXXXX</label>
        <input type="number" id="x2">

        <label>XXXX</label>
        <input type="text" id="x3">

        <label>XXXX</label>
        <input type="text" id="x4">

        <div class="acoes">

            <button id="btnSalvar">
                Salvar
            </button>

            <button id="btnNovo">
                Novo
            </button>

        </div>

    </section>

    <section class="card">

        <h2>Pesquisar por Tipo</h2>

        <input id="tipoBusca">

        <button id="btnBuscarTipo">
            Buscar
        </button>

        <button id="btnListarTodos">
            Todos
        </button>

    </section>

    <section class="card">

        <h2>Pets Cadastrados</h2>

        <table>

            <thead>
                <tr>
                    <th>ID</th>
                    <th>Nome</th>
                    <th>Email</th>
                    <th>XXXX</th>
                    <th>XXXXX</th>
                    <th>XXXX</th>
                    <th>XXXX</th>
                    <th>XXXXX</th>
                </tr>
            </thead>

            <tbody id="tbodyPets">

            </tbody>

        </table>

        <div id="pagination">

        </div>

    </section>

</div>

<script type="module" src="./front/app.js"></script>

</body>
</html>
